name: Feature typecheck

on:
  push:
    branches:
      - feature/typecheck-cleanup
    paths-ignore:
      - .github/typecheck-result.txt

permissions:
  contents: write

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Run typecheck and publish log
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          npm run typecheck > typecheck.log 2>&1
          code=$?
          printf '\nexit_code=%s\n' "$code" >> typecheck.log

          content=$(base64 -w 0 typecheck.log)
          api="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/contents/.github/typecheck-result.txt"
          current_sha=$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            "$api?ref=$GITHUB_REF_NAME" | jq -r '.sha // empty' 2>/dev/null)

          payload=$(jq -n \
            --arg message "Update temporary typecheck result" \
            --arg content "$content" \
            --arg branch "$GITHUB_REF_NAME" \
            --arg sha "$current_sha" \
            'if $sha == "" then {message:$message,content:$content,branch:$branch} else {message:$message,content:$content,branch:$branch,sha:$sha} end')

          curl --fail-with-body -L -X PUT \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$api" \
            -d "$payload"

          exit "$code"
